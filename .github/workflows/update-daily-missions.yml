name: Update daily museum missions

on:
  schedule:
    - cron: "17 8 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate daily mission data
        run: node scripts/update-daily-missions.mjs

      - name: Commit daily mission data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily museum missions"
          file_pattern: daily-missions.json museum-library.json
